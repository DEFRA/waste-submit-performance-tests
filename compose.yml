# Runs the suite locally against a released image of waste-submit-reg-packaging-api,
# with Postgres for the service and LocalStack standing in for the results bucket.
#   docker compose up --build --exit-code-from development
services:
  development:
    build: .
    volumes:
      - ./results:/opt/perftest/results
    depends_on:
      service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      ENVIRONMENT: local
      BASE_URL: http://service:8085
      PROFILE: ${PROFILE:-all}
      DURATION: ${DURATION:-5m}
      S3_ENDPOINT: http://localstack:4566
      RESULTS_OUTPUT_S3_PATH: s3://test-results
    networks:
      - performance-tests

  localstack:
    image: localstack/localstack:4.3.0
    env_file:
      - 'compose/aws.env'
    environment:
      LS_LOG: WARN
      SERVICES: s3
    volumes:
      - ./compose/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD', 'stat', '/tmp/READY']
      interval: 3s
      start_period: 5s
      retries: 10
    networks:
      - performance-tests

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waste_submit_reg_packaging_api
      POSTGRES_USER: waste_submit_reg_packaging_api
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'waste_submit_reg_packaging_api']
      interval: 3s
      retries: 10
    networks:
      - performance-tests

  service:
    image: defradigital/waste-submit-reg-packaging-api:${SERVICE_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      Postgres__Host: postgres
      Postgres__UseIamAuthentication: false
      Postgres__SslMode: Disable
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 10
    networks:
      - performance-tests

networks:
  performance-tests:
    driver: bridge
